# 拷到各仓库的 .github/workflows/gitleaks.yml，规则用仓库根的 .gitleaks.toml（拷自 code_knowledge 的 01_skill/script/gitleaks.toml）。
# 只扫这次推送或 PR 新增的提交：有的仓库历史里留着已作废的值，不重写历史。
name: gitleaks
on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: scan new commits
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="-1 $AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          ./gitleaks git . --config .gitleaks.toml --no-banner --redact --log-opts="$range"
